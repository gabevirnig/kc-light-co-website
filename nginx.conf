server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  location = /index.html { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; }
  location ~ ^/(f|v[0-9]+)/ { add_header Cache-Control "public, max-age=2592000, immutable"; add_header X-Content-Type-Options nosniff always; }
}
