services:
  kclc-demo:
    image: nginx:1.27-alpine
    container_name: kclc-demo
    restart: unless-stopped
    ports:
      - "8015:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
